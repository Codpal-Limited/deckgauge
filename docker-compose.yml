# BIND_HOST — the host interface every published port below binds to.
#
# Unset (self-host / OSS / local dev) it expands to the empty string, so each
# mapping stays exactly `"5433:5432"` and Docker binds 0.0.0.0 as it always
# has. scripts/check-compose-defaults.sh pins that: the rendered default config
# is byte-identical with this variable absent.
#
# A HOSTED box sets `BIND_HOST=127.0.0.1:` in deploy/.env.hosted, which reaches
# Compose via the `--env-file` that deploy/deploy-hosted.sh already requires.
# That script will not deploy unless the RENDERED config binds every published
# port to loopback — it asserts `docker compose config` rather than the env
# file, because an exported BIND_HOST in the operator's shell takes precedence
# over --env-file. scripts/check-bind-host.sh enforces the prefix below in CI.
# Nothing then reaches these ports from off
# the box: the Cloudflare Tunnel resolves `web`, `api` and `keycloak` by service
# name on the Compose network (deploy/cloudflared/config.example.yml), so it
# never needs a published port at all, and the host firewall stops being the
# only thing between the internet and an unauthenticated Redis and a Postgres
# full of customer provider credentials.
#
# NOTE the single dash, as with KC_HOSTNAME_PORT below: `-` substitutes only
# when the variable is UNSET. Here the default is empty either way, so `-` and
# `:-` behave identically — the single dash is used for consistency with the
# convention this repo already established for hosted-clearable values.
#
# NOTE the trailing colon is part of the VALUE, because Compose cannot nest an
# interpolation inside a `${VAR:+...}` replacement. `BIND_HOST=127.0.0.1` with
# no colon renders `127.0.0.15433:5432`, which Compose rejects at parse time —
# it fails loudly rather than binding the wrong interface.
#
# Why a prefix and not `ports:` overrides in the hosted overlay: Compose MERGES
# port lists across `-f` files rather than replacing them, so an overlay can add
# a mapping but can never retract or re-bind one. The interface has to be
# controllable at the point of declaration.
services:
  postgres:
    image: postgres:16-alpine
    container_name: ${CONTAINER_PREFIX:-vp-cockpit}-postgres
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    command:
      - "postgres"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_cache_size=256MB"
      - "-c"
      - "max_connections=30"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cockpit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cockpit}
      POSTGRES_DB: ${POSTGRES_DB:-cockpit}
    ports:
      - "${BIND_HOST-}5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cockpit} -d ${POSTGRES_DB:-cockpit}"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 10s

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: ${CONTAINER_PREFIX:-vp-cockpit}-clickhouse
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 3G   # server-side cap in clickhouse/config/memory.xml is 2.5 GiB (~500 MiB headroom for kernel/page cache and process overhead)
    ports:
      - "${BIND_HOST-}8123:8123"   # HTTP interface (used by @clickhouse/client and backup scripts)
      - "${BIND_HOST-}9000:9000"   # Native TCP (optional, for CLI)
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/config:/etc/clickhouse-server/config.d:ro
      - ./clickhouse/schemas:/docker-entrypoint-initdb.d:ro
    environment:
      CLICKHOUSE_DB: cockpit
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-cockpit}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-cockpit}
      # Organization isolation is enforced by ClickHouse ROW POLICIES, and
      # CREATE ROW POLICY / CREATE ROLE are access-management statements. Without
      # this the migration's policy baseline fails with
      #   Code 497 ... it's necessary to have the grant CREATE ROW POLICY
      # and it fails LOUDLY on purpose, because skipping it would leave every
      # table world-readable (ClickHouse row policies are permissive by default:
      # an object covered by no policy is readable in full by any identity).
      #
      # The image's entrypoint rewrites users.d/default-user.xml on every start,
      # so this takes effect on a container recreate — no volume reset needed.
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: ${CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT:-1}
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user ${CLICKHOUSE_USER:-cockpit} --password ${CLICKHOUSE_PASSWORD:-cockpit} --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: ${CONTAINER_PREFIX:-vp-cockpit}-redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M   # BullMQ queue state outgrew the previous 64M cap; BGSAVE fork was OOM-killed, blocking writes via stop-writes-on-bgsave-error
    command:
      - "redis-server"
      - "--save"
      - "60"
      - "1"
      - "--maxmemory"
      - "384mb"               # self-bound below the cgroup cap to leave room for the BGSAVE fork's copy-on-write pages
      - "--maxmemory-policy"
      - "noeviction"          # queue invariants: never evict BullMQ job keys
      - "--loglevel"
      - "warning"
    ports:
      - "${BIND_HOST-}6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 5s

  keycloak-db:
    image: postgres:16-alpine
    container_name: ${CONTAINER_PREFIX:-vp-cockpit}-keycloak-db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: ${CONTAINER_PREFIX:-vp-cockpit}-keycloak
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    entrypoint: ["/opt/keycloak/configure-microsoft-idp.sh"]
    command: /opt/keycloak/bin/kc.sh start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      # Cap JVM heap — default uses ~1.9 GB which is excessive for local dev
      JAVA_OPTS_APPEND: "-Xms128m -Xmx384m"
      # Use localhost so browser redirects work; server-side calls use Docker service name
      KC_HOSTNAME: ${KC_HOSTNAME:-localhost}
      # NOTE the single dash: `-` substitutes only when the variable is UNSET,
      # whereas `:-` would also substitute for an explicitly EMPTY value. A
      # hosted deployment behind a TLS-terminating tunnel on :443 must be able
      # to CLEAR this so Keycloak builds URLs with no explicit port, so `:-`
      # would make that impossible. This is the one place the distinction matters.
      KC_HOSTNAME_PORT: "${KC_HOSTNAME_PORT-8080}"
      KC_HOSTNAME_STRICT: "${KC_HOSTNAME_STRICT:-false}"
      # Hosted deployments set this to the public web origin (e.g.
      # https://app.deckgauge.com); the entrypoint substitutes it into the
      # vp-cockpit-web client's __PUBLIC_ORIGIN__ placeholder. Empty resolves to
      # http://localhost:3000, i.e. unchanged self-host behaviour.
      KEYCLOAK_PUBLIC_ORIGIN: ${KEYCLOAK_PUBLIC_ORIGIN:-}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Microsoft Entra ID SSO (optional — leave blank to disable)
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-}
    ports:
      - "${BIND_HOST-}8080:8080"
    volumes:
      # Read-only, and NOT at the import path: the entrypoint processes this into
      # /opt/keycloak/data/import/realm.json inside the container. Mounting it at
      # the import path (writable) is what let the entrypoint write a processed
      # realm back over the committed file.
      - ./keycloak/realm-export.json:/opt/keycloak/realm-src/realm.json:ro
      - ./keycloak/configure-microsoft-idp.sh:/opt/keycloak/configure-microsoft-idp.sh:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro
    depends_on:
      keycloak-db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        # Selects whether the image CONTAINS packages/enterprise. Driven by the same
        # variable as the runtime edition below, so an image cannot be built as one
        # edition and run as the other — which would fall back to Community silently.
        EDITION: "${DECKGAUGE_EDITION:-community}"
    container_name: ${CONTAINER_PREFIX:-vp-cockpit}-api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1536M   # Fastify API; 256M->768M->1536M. Bumped after the timesheet engine OOM'd Node ("JS heap out of memory") on a large org (~95k ADO items / ~42k with transitions): the report page now runs two engine passes — the month CapEx report AND the year-window epic breakdown — and computeTimesheet slices every span per-day, so the annual pass allocates ~12x the monthly one; several of these cached in the 60s TtlCache crossed the 768M cap. Follow-up cure: bound fetchTransitions by the window `from` and/or cap TtlCache size instead of loading all history each pass.
    ports:
      - "${BIND_HOST-}3001:3001"
    environment:
      # Pin V8's heap below the cgroup cap so it GCs hard instead of cgroup-OOM-killing (mirrors the web service). ~256M headroom for non-heap.
      NODE_OPTIONS: "--max-old-space-size=1280"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-cockpit}:${POSTGRES_PASSWORD:-cockpit}@postgres:5432/${POSTGRES_DB:-cockpit}"
      REDIS_URL: "redis://redis:6379"
      CLICKHOUSE_URL: "http://${CLICKHOUSE_USER:-cockpit}:${CLICKHOUSE_PASSWORD:-cockpit}@clickhouse:8123/cockpit"
      # The SEPARATE login the API scopes per-organization reads through, activating
      # one ClickHouse role per query (design doc D3). Empty by default, which means
      # "this deployment has not split its read path yet" — reads then run through
      # CLICKHOUSE_URL above, which spans every organization. This is also the
      # container that provisions an organization's ClickHouse role, so it is the one
      # that has to know which login to grant it to.
      #
      # **It is now passed to the worker as well** (see the worker service below).
      # This comment used to say the omission there was deliberate, on the grounds
      # that "the worker is the cross-tenant ingest identity by design (D1)". True of
      # the worker's WRITES; false of its READS, which were not scoped at all — and a
      # justification for an absent boundary is the hardest kind of comment to
      # disbelieve. D1 is about ingest.
      #
      # It must never name the same user as CLICKHOUSE_URL — that user
      # carries a permissive `USING 1` policy on every object, which ORs past every
      # tenant predicate, and provisioning refuses the combination outright.
      CLICKHOUSE_READ_URL: "${CLICKHOUSE_READ_URL:-}"
      # The OPERATOR's half of the gate on creating a SECOND organization — the
      # other half is a licence carrying `multi_org` (DECKGAUGE_LICENSE_FILE
      # below), because more than one organization per installation is an
      # enterprise entitlement. Community answers no however this is set. Two
      # independent halves on purpose: renewing into a tier that happens to
      # include multi_org must not silently turn a single-tenant deployment into a
      # multi-tenant one behind whoever runs it.
      #
      # Off by default, and it has to be listed here to work at all: this `environment:` block is an explicit
      # whitelist, so a value present only in .env never reaches the container —
      # which is how the flag the whole tenancy programme is gated on ended up
      # with no way to turn it on in a deployed stack.
      #
      # It is narrower than its name suggests. The ONLY code that reads it is
      # OrganizationService.bootstrap: it decides whether the one-organization cap
      # applies, and whether an admin-less organization is adopted by name. Every
      # tenant-scoping check is unconditional, so this does not switch multi-org
      # behaviour ON — it stops preventing a second tenant from existing.
      #
      # Enabling it is a one-way door in practice: the first second organization
      # creates rows that any remaining unscoped read would mix. Before turning it
      # on, split the ClickHouse read path (CLICKHOUSE_READ_URL above) — with it
      # empty, reads run as the ingest identity, whose `ingest_all … USING 1`
      # policy ORs past every per-organization row policy.
      DECKGAUGE_MULTI_ORG: "${DECKGAUGE_MULTI_ORG:-false}"
      # The edition, and the module path the loader resolves. Both had to be listed
      # here to work at all — this `environment:` block is an explicit whitelist, so
      # a value present only in .env never reaches the container. Their absence is
      # why DECKGAUGE_MULTI_ORG (which WAS whitelisted) could switch on a paid
      # feature that no licence could gate: the switch was wired to production and
      # the licence was not.
      DECKGAUGE_EDITION: "${DECKGAUGE_EDITION:-community}"
      DECKGAUGE_ENTERPRISE_MODULE: "${DECKGAUGE_ENTERPRISE_MODULE:-}"
      # The third leg of the same trio, and it was the missing one: edition and
      # module path reached the container but the LICENCE could not, so an
      # enterprise image had no way to be entitled to anything. Point it at a path
      # under the mount below.
      #
      # Absent or unreadable resolves to features-off (verifyLicense returns
      # `absent`/`invalid`), which is the safe direction — a mis-configured licence
      # withholds paid features rather than granting them.
      DECKGAUGE_LICENSE_FILE: "${DECKGAUGE_LICENSE_FILE:-}"
      JIRA_CONFIG_PATH: "/app/config/jira.yaml"
      # Must equal the `iss` claim Keycloak stamps into tokens, which is driven
      # by the keycloak service's KC_HOSTNAME. Hosted deployments set both.
      KEYCLOAK_ISSUER: "${KEYCLOAK_ISSUER:-http://localhost:8080/realms/vp-cockpit}"
      # Server-side only — stays on the container network even when hosted.
      # NOT browser-facing: the api fetches this from inside its own container, so
      # it must use the compose service name and it takes no override. Deliberately
      # NOT "${KEYCLOAK_JWKS_URI:-...}" — .env, .env.example and apps/web/.env.local
      # all carry the localhost form for host-side `pnpm dev`, and inside the api
      # container localhost:8080 is the container itself. Interpolating this lets a
      # stale .env win, and every JWT verification then dies with ECONNREFUSED
      # 127.0.0.1:8080 while /health stays green — which presents as a fully loaded
      # app whose every board is empty, i.e. reads as data loss.
      #
      # Restored twice now (c17af07b, then again here after 87baadc7 reverted it).
      # scripts/check-pinned-env.sh exists to stop a third time.
      KEYCLOAK_JWKS_URI: "http://keycloak:8080/realms/vp-cockpit/protocol/openid-connect/certs"
    volumes:
      - uploads_data:/app/uploads
      # A licence is deployment-specific data and must never be baked into an
      # image — an image carrying one is a leak that travels wherever the image
      # does. So it arrives as a read-only mount, and DECKGAUGE_LICENSE_FILE above
      # names a path inside it (e.g. /app/.license-keys/dev.license).
      #
      # Harmless when unused: community edition never reads it, and Docker creating
      # an empty host directory costs nothing (.license-keys/ is gitignored). Mint a
      # dev one with scripts/mint-dev-license.sh.
      - "${DECKGAUGE_LICENSE_DIR:-./.license-keys}:/app/.license-keys:ro"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ${CONTAINER_PREFIX:-vp-cockpit}-web
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1500M   # Next.js production server; bumped 384M -> 768M -> 1500M as Phase 3 widget load + board RSC payload grew. The real cure is reducing per-mutation over-fetch (see projects.ts revalidate cleanup + page.tsx fetchAllProjects caching); this cap is the headroom band-aid.
    ports:
      - "${BIND_HOST-}3000:3000"
    environment:
      NODE_OPTIONS: "--max-old-space-size=1280"
      # Corporate networks MITM outbound TLS; the worker already runs with cert
      # verification disabled (apps/worker/Dockerfile). The web server now also makes
      # an outbound call to graph.microsoft.com (saveGraphToken validates the pasted
      # token via /me), so it needs the same, or that fetch fails ("token not accepted").
      NODE_TLS_REJECT_UNAUTHORIZED: "${NODE_TLS_REJECT_UNAUTHORIZED:-0}"
      # Server-side (RSC / server actions) — container network, unchanged when hosted.
      API_URL: "${API_URL:-http://api:3001}"
      # BROWSER-FACING. apps/web/next.config.ts defines no rewrites, so this must
      # be a URL the user's browser can resolve. Hosted deployments point it at
      # the public API hostname and add a matching tunnel ingress route.
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:3001}"
      # BROWSER-FACING (OIDC redirects). Must match KC_HOSTNAME and the realm's
      # redirectUris — see KEYCLOAK_PUBLIC_ORIGIN.
      KEYCLOAK_ISSUER: "${KEYCLOAK_ISSUER:-http://localhost:8080/realms/vp-cockpit}"
      # Server-side token exchange — container network.
      KEYCLOAK_INTERNAL_URL: "${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080/realms/vp-cockpit}"
      KEYCLOAK_CLIENT_ID: "vp-cockpit-web"
      KEYCLOAK_CLIENT_SECRET: "${KEYCLOAK_CLIENT_SECRET:-vp-cockpit-secret}"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:-vp-cockpit-nextauth-secret}"
      NEXTAUTH_URL: "${NEXTAUTH_URL:-http://localhost:3000}"
      AUTH_TRUST_HOST: "true"
      # Microsoft Graph "Connect" OAuth (org-tree directory sync). Empty = the
      # Source tab shows a "not configured" note; no errors.
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
    depends_on:
      api:
        # web is a standalone server and retries the API at request time, so it need
        # only wait for the api container to start — not for it to pass its healthcheck
        # (a cold tsx boot can exceed the grace window and would otherwise block web).
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      args:
        EDITION: "${DECKGAUGE_EDITION:-community}"
    container_name: ${CONTAINER_PREFIX:-vp-cockpit}-worker
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M   # BullMQ host for 6+ queue+worker pairs (jira/gitlab/ado/github/sync-run-prune/roadmap-slip). The ADO processor streams large projects (azure-devops-sync.processor → streamWorkItems → promoteProjectStream): work items are fetched, dual-written to ClickHouse, and promoted one batch at a time. Bumped 384M→768M (2026-07-31): after one org's ADO source list grew to 17 projects, transition-write peaks (two projects at ~9.2k and ~32k work items) crossed 384M and the container was cgroup-killed ~every 20-30min (RestartCount climbing). Each kill rewinds the sequential per-project run to the top of the list, permanently starving the tail projects, which never got stamped. 768M absorbs the peaks while leaving VM headroom (~5.9GiB total; 1024M was too aggressive with ~840MiB free).
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-cockpit}:${POSTGRES_PASSWORD:-cockpit}@postgres:5432/${POSTGRES_DB:-cockpit}"
      REDIS_URL: "redis://redis:6379"
      CLICKHOUSE_URL: "http://${CLICKHOUSE_USER:-cockpit}:${CLICKHOUSE_PASSWORD:-cockpit}@clickhouse:8123/cockpit"
      # The SEPARATE login the worker scopes its READS through — the same identity
      # the api uses, deliberately not a fourth one: `ch-provisioning.ts` grants
      # every organization's role to exactly one read login, so reusing it means no
      # new credential and no new grant pass for an operator to forget.
      #
      # **This block is an explicit whitelist**, and the comment on the api's copy
      # of this variable used to say the omission here was deliberate ("the worker
      # is the cross-tenant ingest identity by design"). That was true of the
      # worker's WRITES and false of its READS: `chClientFor(organizationId).queryRows`
      # ignored its argument and read every tenant, so the org-tree sync credited
      # one tenant's commits to another's employees and the ADO prior-state sweep
      # WROTE another tenant's `from_state` back under this tenant's key.
      #
      # Empty by default. Empty means the row-policy layer is ABSENT and the
      # `organization_id` predicate (enforced by `assertOrgScopedSql`) is the only
      # thing scoping a worker read; set it to add the second layer.
      #
      # An earlier version of this comment claimed empty was "SAFE here in a way it
      # is not for the api". Two things were wrong with that. It inverted the
      # asymmetry it cited — an api read that loses its boundary serves a wrong
      # page, whereas a worker read that loses its boundary WRITES, so empty
      # deserves more care here, not less. And the code it described did not work:
      # the unsplit path asked the ingest identity for a role it was never granted,
      # which ClickHouse answers with `Code 512 SET_NON_GRANTED_ROLE`, so every
      # read threw and the sync zeroed `statsJson` while completing normally. The
      # unsplit path now activates no role (`chUnroledReaderFor`) and relies on the
      # predicate, which is what makes empty genuinely workable.
      #
      # Reads only. The worker's writes still go through CLICKHOUSE_URL, which must
      # stay the ingest identity (design doc D1) — it ingests for every
      # organization from one queue.
      CLICKHOUSE_READ_URL: "${CLICKHOUSE_READ_URL:-}"
      JIRA_CONFIG_PATH: "/app/config/jira.yaml"
      # The edition seam, worker side. apps/worker/src/edition-loader.ts has always
      # read DECKGAUGE_EDITION, but this service declared none of these — and this
      # `environment:` block is an explicit whitelist, so a value present only in
      # .env never reaches the container. Combined with a Dockerfile that never
      # copied packages/enterprise, the worker's half of the seam (allowIngest, which
      # gates ingest per organization, and runPeriodicWork) could not run in ANY
      # deployed stack. Same defect the api had; it simply outlived the api's fix.
      #
      # DECKGAUGE_MULTI_ORG is deliberately NOT here: no worker code reads it. The
      # only reader is OrganizationService.bootstrap, in the api.
      DECKGAUGE_EDITION: "${DECKGAUGE_EDITION:-community}"
      DECKGAUGE_ENTERPRISE_MODULE: "${DECKGAUGE_ENTERPRISE_MODULE:-}"
      DECKGAUGE_LICENSE_FILE: "${DECKGAUGE_LICENSE_FILE:-}"
      # The escape hatch for the blast-radius cap (MASS_DELETION_SHARE in
      # jira-promote.service.ts): a sync that confirms most of a board has been
      # deleted writes nothing unless this is 1. Set it for the one run that
      # drains a genuine bulk deletion, then put it back — a container that
      # leaves it on has no cap at all.
      JIRA_ALLOW_MASS_DELETION: "${JIRA_ALLOW_MASS_DELETION:-0}"
      # Overrides the image's build-time default (apps/worker/Dockerfile) without
      # a rebuild. Default 0 for corporate-MITM local dev; hosted sets 1, because
      # a public box has no MITM proxy and 0 would accept a forged certificate
      # for any provider while the worker holds customer tokens.
      NODE_TLS_REJECT_UNAUTHORIZED: "${NODE_TLS_REJECT_UNAUTHORIZED:-0}"
      # Microsoft Graph app-registration creds — used to redeem each tree's stored
      # per-user refresh token for a Graph access token during org-source sync.
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      # ADO code-intelligence tuning knobs. These are all documented as
      # env-tunable and read at call time, but this block whitelists what the
      # container actually sees — without a passthrough here, setting them in
      # .env silently does nothing (which is exactly what happened when the
      # history backfill was first switched on). Every one is unset-safe: the
      # readers use `Number(x) || default` or a truthiness check, so an empty
      # value falls back to the built-in default.
      #   ADO_BACKFILL_*            — backward-walking history backfill, off
      #                               unless ADO_BACKFILL_ENABLED=1; see
      #                               ado-intelligence-sync.handler.ts.
      #   ADO_REPO_INTEL_TIMEOUT_MS — per-repo fetch ceiling.
      #   ADO_CRON_INTERVAL         — ADO sync period, kept separate from
      #                               CRON_INTERVAL so throttling ADO does not
      #                               stale out Jira/GitHub/GitLab.
      ADO_BACKFILL_ENABLED: ${ADO_BACKFILL_ENABLED:-}
      ADO_BACKFILL_CHUNK_DAYS: ${ADO_BACKFILL_CHUNK_DAYS:-}
      ADO_BACKFILL_FLOOR_DAYS: ${ADO_BACKFILL_FLOOR_DAYS:-}
      ADO_BACKFILL_REPOS_PER_RUN: ${ADO_BACKFILL_REPOS_PER_RUN:-}
      ADO_REPO_INTEL_TIMEOUT_MS: ${ADO_REPO_INTEL_TIMEOUT_MS:-}
      ADO_CRON_INTERVAL: ${ADO_CRON_INTERVAL:-}
      # Noisy-neighbour cap for POOLED hosting (hosted-SaaS program design §4.3).
      # Bounds how many jobs one organization may run at once on the GitHub
      # `hot` (concurrency 4) and `warm` (2) tier queues — the only workers in
      # this process that run more than one job at a time, and so the only place
      # one tenant can take a slot another tenant needed. `cold` runs at
      # concurrency 1 and is deliberately NOT gated: one job in flight is already
      # at most one per organization, so a cap there could never refuse anything.
      # The provider sweeps (jira/ado/github/gitlab) are single jobs that iterate
      # EVERY tenant's connections in one pass, so a per-org cap has nothing to
      # bind on there either. See STATE.md.
      #
      # Empty/0 = disabled, which is the default and is exactly the behaviour
      # before the cap existed: no organization lookup, no counter, no deferral.
      # Self-host and open-source stay unchanged; hosted sets a small integer.
      WORKER_MAX_CONCURRENT_JOBS_PER_ORG: ${WORKER_MAX_CONCURRENT_JOBS_PER_ORG:-}
    volumes:
      # Same read-only licence mount as the api: the worker evaluates the licence
      # itself (it calls the module's own verifyLicense via createEnterprise), so
      # DECKGAUGE_LICENSE_FILE above has to resolve inside THIS container too.
      - "${DECKGAUGE_LICENSE_DIR:-./.license-keys}:/app/.license-keys:ro"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy


volumes:
  postgres_data:
  redis_data:
  uploads_data:
  keycloak_db_data:
  clickhouse_data:
