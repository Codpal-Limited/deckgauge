name: __PROJECT_NAME__
services:
  api:
    build:
      context: __PROJECT_ROOT__
      dockerfile: apps/api/Dockerfile
      args:
        EDITION: community
    container_name: deckgauge-api
    depends_on:
      clickhouse:
        condition: service_healthy
        required: true
      postgres:
        condition: service_healthy
        required: true
      redis:
        condition: service_healthy
        required: true
    deploy:
      resources:
        limits:
          memory: "1610612736"
    environment:
      CLICKHOUSE_READ_URL: ""
      CLICKHOUSE_URL: http://cockpit:__required_not_a_credential__@clickhouse:8123/cockpit
      DATABASE_URL: postgresql://cockpit:__required_not_a_credential__@postgres:5432/cockpit
      DECKGAUGE_EDITION: community
      DECKGAUGE_ENTERPRISE_MODULE: ""
      DECKGAUGE_LICENSE_FILE: ""
      DECKGAUGE_MULTI_ORG: "false"
      JIRA_CONFIG_PATH: /app/config/jira.yaml
      KEYCLOAK_ISSUER: http://localhost:8080/realms/deckgauge
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/deckgauge/protocol/openid-connect/certs
      NODE_OPTIONS: --max-old-space-size=1280
      REDIS_URL: redis://redis:6379
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://localhost:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      timeout: 5s
      interval: 10s
      retries: 10
      start_period: 1m30s
    networks:
      default: null
    ports:
      - mode: ingress
        target: 3001
        published: "3001"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: volume
        source: uploads_data
        target: /app/uploads
        volume: {}
      - type: bind
        source: __PROJECT_ROOT__/.license-keys
        target: /app/.license-keys
        read_only: true
        bind: {}
  clickhouse:
    container_name: deckgauge-clickhouse
    deploy:
      resources:
        limits:
          memory: "3221225472"
    environment:
      CLICKHOUSE_DB: cockpit
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      CLICKHOUSE_PASSWORD: __required_not_a_credential__
      CLICKHOUSE_USER: cockpit
    healthcheck:
      test:
        - CMD-SHELL
        - clickhouse-client --user cockpit --password __required_not_a_credential__
          --query 'SELECT 1'
      timeout: 5s
      interval: 10s
      retries: 12
      start_period: 20s
    image: clickhouse/clickhouse-server:25.8-alpine
    networks:
      default: null
    ports:
      - mode: ingress
        target: 8123
        published: "8123"
        protocol: tcp
      - mode: ingress
        target: 9000
        published: "9000"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: volume
        source: clickhouse_data
        target: /var/lib/clickhouse
        volume: {}
      - type: bind
        source: __PROJECT_ROOT__/clickhouse/config
        target: /etc/clickhouse-server/config.d
        read_only: true
        bind: {}
      - type: bind
        source: __PROJECT_ROOT__/clickhouse/schemas
        target: /docker-entrypoint-initdb.d
        read_only: true
        bind: {}
  keycloak:
    command:
      - /opt/keycloak/bin/kc.sh
      - start-dev
      - --import-realm
    container_name: deckgauge-keycloak
    depends_on:
      keycloak-db:
        condition: service_healthy
        required: true
    deploy:
      resources:
        limits:
          memory: "536870912"
    entrypoint:
      - /opt/keycloak/configure-microsoft-idp.sh
    environment:
      JAVA_OPTS_APPEND: -Xms128m -Xmx384m
      KC_BOOTSTRAP_ADMIN_PASSWORD: __required_not_a_credential__
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_DB: postgres
      KC_DB_PASSWORD: __required_not_a_credential__
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_STRICT: "false"
      KEYCLOAK_CLIENT_SECRET: __required_not_a_credential__
      KEYCLOAK_PUBLIC_ORIGIN: http://localhost:3000
      MICROSOFT_CLIENT_ID: ""
      MICROSOFT_CLIENT_SECRET: ""
      MICROSOFT_TENANT_ID: ""
      POST_LOGOUT_REDIRECT_URL: ""
      SMTP_AUTH: ""
      SMTP_FROM: no-reply@deckgauge.com
      SMTP_FROM_DISPLAY_NAME: Deckgauge
      SMTP_HOST: mailpit
      SMTP_PASSWORD: ""
      SMTP_PORT: "1025"
      SMTP_REPLY_TO: ""
      SMTP_SSL: "false"
      SMTP_STARTTLS: "false"
      SMTP_USER: ""
    image: quay.io/keycloak/keycloak:26.7
    networks:
      default: null
    ports:
      - mode: ingress
        target: 8080
        published: "8080"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: __PROJECT_ROOT__/keycloak/realm-export.json
        target: /opt/keycloak/realm-src/realm.json
        read_only: true
        bind: {}
      - type: bind
        source: __PROJECT_ROOT__/keycloak/configure-microsoft-idp.sh
        target: /opt/keycloak/configure-microsoft-idp.sh
        read_only: true
        bind: {}
      - type: bind
        source: __PROJECT_ROOT__/keycloak/themes
        target: /opt/keycloak/themes
        read_only: true
        bind: {}
  keycloak-db:
    container_name: deckgauge-keycloak-db
    deploy:
      resources:
        limits:
          memory: "134217728"
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_PASSWORD: __required_not_a_credential__
      POSTGRES_USER: keycloak
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U keycloak -d keycloak
      timeout: 5s
      interval: 5s
      retries: 6
      start_period: 10s
    image: postgres:16-alpine
    networks:
      default: null
    restart: unless-stopped
    volumes:
      - type: volume
        source: keycloak_db_data
        target: /var/lib/postgresql/data
        volume: {}
  mailpit:
    container_name: deckgauge-mailpit
    deploy:
      resources:
        limits:
          memory: "134217728"
    environment:
      MP_MAX_MESSAGES: "500"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    image: axllent/mailpit:v1.21
    networks:
      default: null
    ports:
      - mode: ingress
        target: 8025
        published: "8025"
        protocol: tcp
    restart: unless-stopped
  postgres:
    command:
      - postgres
      - -c
      - random_page_cost=1.1
      - -c
      - effective_cache_size=256MB
      - -c
      - max_connections=30
    container_name: deckgauge-postgres
    deploy:
      resources:
        limits:
          memory: "268435456"
    environment:
      POSTGRES_DB: cockpit
      POSTGRES_PASSWORD: __required_not_a_credential__
      POSTGRES_USER: cockpit
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U cockpit -d cockpit
      timeout: 5s
      interval: 5s
      retries: 6
      start_period: 10s
    image: postgres:16-alpine
    networks:
      default: null
    ports:
      - mode: ingress
        target: 5432
        published: "5433"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: volume
        source: postgres_data
        target: /var/lib/postgresql/data
        volume: {}
  redis:
    command:
      - sh
      - -c
      - exec redis-server --save 60 1 --maxmemory 384mb --maxmemory-policy noeviction
        --loglevel warning $${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}
    container_name: deckgauge-redis
    deploy:
      resources:
        limits:
          memory: "536870912"
    environment:
      REDIS_PASSWORD: ""
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli $${REDIS_PASSWORD:+--no-auth-warning -a "$$REDIS_PASSWORD"} ping
          | grep -q PONG
      timeout: 5s
      interval: 5s
      retries: 6
      start_period: 5s
    image: redis:7.4-alpine
    networks:
      default: null
    ports:
      - mode: ingress
        target: 6379
        published: "6379"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: volume
        source: redis_data
        target: /data
        volume: {}
  web:
    build:
      context: __PROJECT_ROOT__
      dockerfile: apps/web/Dockerfile
    container_name: deckgauge-web
    depends_on:
      api:
        condition: service_started
        required: true
    deploy:
      resources:
        limits:
          memory: "1572864000"
    environment:
      API_URL: http://api:3001
      AUTH_TRUST_HOST: "true"
      KEYCLOAK_CLIENT_ID: deckgauge-web
      KEYCLOAK_CLIENT_SECRET: __required_not_a_credential__
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/realms/deckgauge
      KEYCLOAK_ISSUER: http://localhost:8080/realms/deckgauge
      MICROSOFT_CLIENT_ID: ""
      MICROSOFT_CLIENT_SECRET: ""
      MICROSOFT_TENANT_ID: ""
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXTAUTH_SECRET: __required_not_a_credential__
      NEXTAUTH_URL: http://localhost:3000
      NODE_OPTIONS: --max-old-space-size=1280
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      POST_LOGOUT_REDIRECT_URL: ""
    networks:
      default: null
    ports:
      - mode: ingress
        target: 3000
        published: "3000"
        protocol: tcp
    restart: unless-stopped
  worker:
    build:
      context: __PROJECT_ROOT__
      dockerfile: apps/worker/Dockerfile
      args:
        EDITION: community
    container_name: deckgauge-worker
    depends_on:
      clickhouse:
        condition: service_healthy
        required: true
      postgres:
        condition: service_healthy
        required: true
      redis:
        condition: service_healthy
        required: true
    deploy:
      resources:
        limits:
          memory: "805306368"
    environment:
      ADO_BACKFILL_CHUNK_DAYS: ""
      ADO_BACKFILL_ENABLED: ""
      ADO_BACKFILL_FLOOR_DAYS: ""
      ADO_BACKFILL_REPOS_PER_RUN: ""
      ADO_CRON_INTERVAL: ""
      ADO_REPO_INTEL_TIMEOUT_MS: ""
      CLICKHOUSE_READ_URL: ""
      CLICKHOUSE_URL: http://cockpit:__required_not_a_credential__@clickhouse:8123/cockpit
      DATABASE_URL: postgresql://cockpit:__required_not_a_credential__@postgres:5432/cockpit
      DECKGAUGE_EDITION: community
      DECKGAUGE_ENTERPRISE_MODULE: ""
      DECKGAUGE_LICENSE_FILE: ""
      JIRA_ALLOW_MASS_DELETION: "0"
      JIRA_CONFIG_PATH: /app/config/jira.yaml
      MICROSOFT_CLIENT_ID: ""
      MICROSOFT_CLIENT_SECRET: ""
      MICROSOFT_TENANT_ID: ""
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      REDIS_URL: redis://redis:6379
      WORKER_MAX_CONCURRENT_JOBS_PER_ORG: ""
    networks:
      default: null
    restart: unless-stopped
    volumes:
      - type: bind
        source: __PROJECT_ROOT__/.license-keys
        target: /app/.license-keys
        read_only: true
        bind: {}
networks:
  default:
    name: __PROJECT_NAME___default
volumes:
  clickhouse_data:
    name: __PROJECT_NAME___clickhouse_data
  keycloak_db_data:
    name: __PROJECT_NAME___keycloak_db_data
  postgres_data:
    name: __PROJECT_NAME___postgres_data
  redis_data:
    name: __PROJECT_NAME___redis_data
  uploads_data:
    name: __PROJECT_NAME___uploads_data
